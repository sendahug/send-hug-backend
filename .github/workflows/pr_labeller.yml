name: "Pull Request Labeler"
on:
  pull_request:
    branches: ["dev"]
permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: ".github/labeler.yml"
          sync-labels: true
